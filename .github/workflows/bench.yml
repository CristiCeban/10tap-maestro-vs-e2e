name: Bench (Maestro vs e2e)

# Runs the example/ suite with Maestro (example/.maestro) and with e2e
# (example/tests) on GitHub-hosted runners: Android on ubuntu-latest (API 34
# emulator), iOS on macos-15 (an iPhone simulator). Each run is its own job on
# a fresh runner, with the same prebuilt app (run "Build apps" first). The
# summarize job writes the per-platform, per-arm table to the run summary and
# uploads bench.csv.
on:
  workflow_dispatch:
    inputs:
      runs:
        description: Runs per arm and platform (one fresh runner each)
        default: '5'
      platforms:
        description: Comma-separated platforms
        default: 'android,ios'
      arms:
        description: Comma-separated arms
        default: 'maestro,e2e'
      maestro_version:
        description: Maestro CLI version
        default: '2.11.0'
      anr_guard:
        description: Android ANR guard (disable the launcher, close other apps' ANR dialogs)
        default: 'on'
      agent_device:
        description: >
          agent-device version for the e2e arm (empty = the locked 0.21.28, i.e. the
          published arm). The Maestro arm never loads agent-device, so its setup is
          left exactly as published.
        default: ''

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - id: matrix
        env:
          RUNS: ${{ inputs.runs }}
          PLATFORMS: ${{ inputs.platforms }}
          ARMS: ${{ inputs.arms }}
        run: |
          python3 - >> "$GITHUB_OUTPUT" <<'EOF'
          import json, os
          split = lambda v: [x.strip() for x in os.environ[v].split(',') if x.strip()]
          runs = int(os.environ['RUNS'])
          # Interleave the arms so both see the same runner conditions.
          include = [{'platform': p, 'arm': a, 'run': r}
                     for r in range(1, runs + 1) for p in split('PLATFORMS') for a in split('ARMS')]
          print('matrix=' + json.dumps({'include': include}))
          EOF

  bench:
    needs: plan
    name: bench ${{ matrix.platform }} ${{ matrix.arm }} ${{ matrix.run }}
    runs-on: ${{ matrix.platform == 'ios' && 'macos-15' || 'ubuntu-latest' }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      PLATFORM: ${{ matrix.platform }}
      ARM: ${{ matrix.arm }}
      RUN: ${{ matrix.run }}
      ANR_GUARD: ${{ inputs.anr_guard }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Only e2e needs the workspace dependencies; Maestro runs the YAML.
      - name: Setup
        if: matrix.arm == 'e2e'
        uses: ./.github/actions/setup
        with:
          agent-device-version: ${{ inputs.agent_device }}

      - name: Download the prebuilt app
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$PLATFORM" = ios ]; then
            gh release download bench-apk --dir app --pattern 'TenTapExample.app.zip*'
            (cd app && shasum -a 256 -c TenTapExample.app.zip.sha256 && ditto -x -k TenTapExample.app.zip .)
          else
            gh release download bench-apk --dir app --pattern 'app-release.apk*'
            (cd app && sha256sum -c app-release.apk.sha256)
          fi

      - name: Install Maestro
        if: matrix.arm == 'maestro'
        env:
          MAESTRO_VERSION: ${{ inputs.maestro_version }}
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      # iOS: the same Xcode selection as the build, then the first iPhone on
      # the newest runtime (10tap's nightly script), booted with the app.
      - name: Select Xcode
        if: matrix.platform == 'ios'
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Boot a simulator and install the app
        if: matrix.platform == 'ios'
        run: |
          mkdir -p out
          t=$(date +%s)
          .github/scripts/boot-ios-simulator.sh app/TenTapExample.app
          echo "boot_install_s=$(( $(date +%s) - t ))" >> out/steps.txt

      - name: Run the suite on iOS
        if: matrix.platform == 'ios'
        run: .github/bench/run-arm.sh

      - name: Enable KVM
        if: matrix.platform == 'android'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Same emulator as 10tap's e2e-android job; the device prep and the
      # timed suite are in run-arm.sh.
      - name: Run the suite on Android API 34
        if: matrix.platform == 'android'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_5
          cores: 4
          ram-size: 4096M
          heap-size: 576M
          disable-animations: true
          disable-spellchecker: true
          script: .github/bench/run-arm.sh

      # Maestro names its output folders after the flows, which contain
      # characters (':') that upload-artifact rejects, so upload an archive.
      - name: Archive the results
        if: always()
        run: tar -czf bench-out.tgz out || true

      - name: Upload the results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-${{ matrix.platform }}-${{ matrix.arm }}-${{ matrix.run }}
          path: bench-out.tgz
          if-no-files-found: ignore
          retention-days: 30

  summarize:
    needs: bench
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download the results
        uses: actions/download-artifact@v4
        with:
          pattern: bench-*
          path: results

      - name: Summarize
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for f in results/*/bench-out.tgz; do
            d=$(dirname "$f"); tar -xzf "$f" -C "$d"
          done
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}/jobs" --paginate > jobs.json
          python3 .github/bench/summarize.py results jobs.json bench.csv >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the summary
        uses: actions/upload-artifact@v4
        with:
          name: bench-summary
          path: bench.csv
          retention-days: 90
